services:
    backend:
        container_name: music-release-notifier-backend
        build:
          context: .
          dockerfile: Dockerfile
        environment:
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - POSTGRES_DB=music-release-notifier
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres

            - KEYCLOAK_ISSUER_URI=http://keycloak:7080/realms/music-release-notifier

            - RABBITMQ_EXCHANGE=music_monitor
            - RABBITMQ_QUEUE=release
            - RABBITMQ_ROUTING_KEY=release_routing_key
            - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost
        ports:
          - "7070:7070"
        networks:
            - local_network
            - internal
        depends_on:
          - postgres
          - rabbitmq
          - keycloak

    postgres:
        image: postgres:15
        container_name: postgres
        ports:
            - "5432:5432"
        restart: always
        environment:
            - POSTGRES_DB=music-release-notifier
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
        networks:
            - local_network
            - internal

    rabbitmq:
        image: rabbitmq:4.0.5-management-alpine
        container_name: rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"

    kafka:
        image: bitnami/kafka:latest
        container_name: kafka
        ports:
            - "9092:9092"   # client connections
            - "9093:9093"   # internal controller
        environment:
            # ── REQUIRED FOR KRaft ────────────────────────────────────────
            # unique broker+controller node ID
            - KAFKA_CFG_NODE_ID=1
            # which roles this process will play
            - KAFKA_CFG_PROCESS_ROLES=broker,controller
            # listener names → protocols
            - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            # how to bind the two listeners
            - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
            # which listener is the controller quorum
            - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
            # define the quorum voters (id@<host:port>)
            - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093

            # ── ALLOW PLAIN (non‐TLS) CLIENTS ───────────────────────────────
            - ALLOW_PLAINTEXT_LISTENER=yes

            # ── OPTIONAL OVERRIDES ──────────────────────────────────────────
            # bitnami Kafka image also supports these, if you need them:
            # - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
            # - KAFKA_CFG_NUM_PARTITIONS=3
            # - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false

        networks:
            - local_network
            - internal


    keycloak:
        container_name: music-release-notifier-keycloak
        image: quay.io/keycloak/keycloak:24.0
        environment:
            KC_HOSTNAME: localhost
            KC_HOSTNAME_PORT: 7080
            KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
            KEYCLOAK_ADMIN: admin
            KEYCLOAK_ADMIN_PASSWORD: admin
            KEYCLOAK_IMPORT: /opt/keycloak/data/import/realm-config.json
            KC_HEALTH_ENABLED: "true"
            KC_LOG_LEVEL: info
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:7080/health/ready"]
            interval: 15s
            timeout: 2s
            retries: 15
        command: ["start-dev", "--http-port", "7080", "--https-port", "7443"]
        ports:
            - "7080:7080"
            - "7443:7443"
        networks:
            - local_network
            - internal

networks:
    local_network:
        driver: bridge
    internal:
        driver: bridge
