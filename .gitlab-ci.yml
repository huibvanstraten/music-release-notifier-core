stages:
  - build
  - test
  - publish
  - azure
  - publish-ar
  - deploy

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  ACR_URL: "crmrntest.azurecr.io"

  SERVICE_NAME: "music-release-notifier"
  IMAGE_NAME: "music-release-notifier-core"
  IMAGE_TAG: "v$CI_PIPELINE_ID"

  AR_IMAGE: "$LOCATION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPO/$IMAGE_NAME"

  AZURE_RESOURCE_GROUP: "project-huib"
  AZURE_AKS_CLUSTER: "aks-mrn-test"
  AZURE_SUBSCRIPTION_ID: $mrn_settings_azure_subscription_id
  AZURE_CLIENT_ID: $mrn_settings_azure_service_principal_app_idg
  AZURE_CLIENT_SECRET: $mrn_settings_azure_service_principal_app_password
  AZURE_TENANT_ID: $mrn_settings_azure_tenant_id

include:
  # 1) Upload to Artifact Registry 1
  - component: gitlab.com/google-gitlab-components/artifact-registry/upload-artifact-registry@0.1.0
    inputs:
      stage: publish-ar
      source: $GCR_IMAGE:$IMAGE_TAG
      target: $AR_IMAGE:$IMAGE_TAG

  # 2) Deploy to Cloud Run
  - component: gitlab.com/google-gitlab-components/cloud-run/deploy-cloud-run@0.1.0
    inputs:
      stage: deploy
      image: $AR_IMAGE:$IMAGE_TAG
      project_id: $GCP_PROJECT_ID
      region: $LOCATION
      service: $SERVICE_NAME

# Java image
image: gradle:jdk21
before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle
cache:
  paths:
      - .gradle/wrapper
      - .gradle/caches

#gradle build
build:
  stage: build
  script:
    - ./gradlew --build-cache assemble
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle


#run unit tests
test:
  stage: test
  script: ./gradlew check
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/**/TEST-*.xml
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - build
      - .gradle

# build and publish
build_and_publish:
  stage: publish
  # google/cloud-sdk includes gcloud + docker CLI
  image: google/cloud-sdk:slim
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
    GCR_HOST: gcr.io
    GCR_IMAGE: $GCR_HOST/$GCP_PROJECT_ID/$IMAGE_NAME
  before_script:
    # — Docker Hub login
    - echo "$DOCKER_HUB_PW" | docker login -u "$DOCKER_HUB_USER" --password-stdin

    # — GCR login via gcloud
    - echo "$GCP_SERVICE_KEY" | base64 -d > /tmp/gcp-key.json
    - gcloud auth activate-service-account --key-file /tmp/gcp-key.json
    - gcloud config set project $GCP_PROJECT_ID
    - gcloud auth configure-docker --quiet

  script:
    # 1) build once (add any --build-arg you need)
    - docker build \
      --build-arg NAME="Cloud Run" \
      -t $IMAGE_NAME:$IMAGE_TAG \
      .

    # 2) tag for Docker Hub & GCR
    - docker tag $IMAGE_NAME:$IMAGE_TAG $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG
    - docker tag $IMAGE_NAME:$IMAGE_TAG $GCR_IMAGE:$IMAGE_TAG

    # 3) push both
    - docker push $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG
    - docker push $GCR_IMAGE:$IMAGE_TAG


# build MRN image and push to Azure
push_core_image:
  stage: azure
  image: docker:stable
  services:
      - docker:dind
  variables:
    DOCKER_IMAGE: "mrncore"
  script:
    - docker build -t $DOCKER_IMAGE:$CI_PIPELINE_IID .
    - docker image tag $DOCKER_IMAGE:$CI_PIPELINE_IID $ACR_URL/$DOCKER_IMAGE:$CI_PIPELINE_IID
    - docker login $ACR_URL -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET
    - docker image push $ACR_URL/$DOCKER_IMAGE:$CI_PIPELINE_IID


# build keycloak image and push to Azure
push_keycloak_image:
  stage: azure
  image: docker:stable
  services:
      - docker:dind
  variables:
    DOCKER_IMAGE: "mrnkeycloak"
  script:
    - docker build -t $DOCKER_IMAGE:$CI_PIPELINE_IID .
    - docker image tag $DOCKER_IMAGE:$CI_PIPELINE_IID $ACR_URL/$DOCKER_IMAGE:$CI_PIPELINE_IID
    - docker login $ACR_URL -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET
    - docker image push $ACR_URL/$DOCKER_IMAGE:$CI_PIPELINE_IID
