image: google/cloud-sdk:slim

services:
  - name: docker:24.0.5-dind
    alias: docker

variables:
  # Docker-in-Docker config
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

  # Builds
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  # Container naming
  SERVICE_NAME: "music-release-notifier"
  IMAGE_NAME: "music-release-notifier-core"
  IMAGE_TAG: "v$CI_PIPELINE_ID"

  # Google Artifact Registry
  GCR_IMAGE: "$ARCHIFACT_REPO/$GCP_PROJECT_ID/$IMAGE_NAME"
  AR_HOST: "$LOCATION-docker.pkg.dev"
  AR_IMAGE: "$AR_HOST/$GCP_PROJECT_ID/$ARTIFACT_REPO/$IMAGE_NAME"

stages:
  - build
  - test
  - publish
  - deploy

#gradle build
build:
  stage: build
  image: gradle:jdk21
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
  script:
    - ./gradlew --build-cache assemble
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle

# Unit tests
test:
  stage: test
  image: gradle:jdk21
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
  script:
    - ./gradlew check
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/**/TEST-*.xml
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - build
      - .gradle

# build and publish (Docker Hub and GCP AR)
build_and_publish:
  stage: publish
  before_script:
    # — Docker Hub login
    - echo "$DOCKER_HUB_PW" | docker login -u "$DOCKER_HUB_USER" --password-stdin

    # — GCR login via gcloud
    - echo "$GCP_SERVICE_KEY" | base64 -d > /tmp/gcp-key.json
    - gcloud auth activate-service-account --key-file /tmp/gcp-key.json
    - gcloud config set project $GCP_PROJECT_ID
    - gcloud auth configure-docker --quiet gcr.io "$AR_HOST"

    # Login to Artifact Registry via OAuth token
    - gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin "https://$AR_HOST"

  script:
    # 1) build once (add any --build-arg you need)
    - docker build --build-arg NAME="Cloud Run" -t "$IMAGE_NAME:$IMAGE_TAG" .

    # 2) tag and push Docker
    - docker tag $IMAGE_NAME:$IMAGE_TAG $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG
    - docker push $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG

    # 3) tag and push GCP
    - docker tag $IMAGE_NAME:$IMAGE_TAG $AR_IMAGE:$IMAGE_TAG
    - docker push $GCR_IMAGE:$IMAGE_TAG


# Deploy to Cloud Run
deploy:
  stage: deploy
  image: google/cloud-sdk:slim
  before_script:
    # Authenticate gcloud
    - echo "$GCP_SERVICE_KEY" | base64 -d > /tmp/gcp-key.json
    - gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
    - gcloud config set project "$GCP_PROJECT_ID"
  script:
    - gcloud run deploy "$SERVICE_NAME" \
      --image "$AR_IMAGE:$IMAGE_TAG" \
      --region "$LOCATION" \
      --platform managed \
      --quiet