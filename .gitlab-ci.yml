image: google/cloud-sdk:slim

services:
  - name: docker:24.0.5-dind
    alias: docker

variables:
  # Docker-in-Docker config
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

  # Builds
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  # Container naming
  SERVICE_NAME: "music-release-notifier"
  IMAGE_NAME: "music-release-notifier-core"
  IMAGE_TAG: "v$CI_PIPELINE_ID"

stages:
  - build
  - test
  - publish
  - update_helm_chart

#gradle build
build:
  stage: build
  image: gradle:jdk21
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
  script:
    - ./gradlew --build-cache assemble
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle

# Unit tests
test:
  stage: test
  image: gradle:jdk21
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
  script:
    - ./gradlew check
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/**/TEST-*.xml
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - build
      - .gradle

# build and publish
build_and_publish:
  stage: publish
  before_script:
    # — Docker Hub login
    - echo "$DOCKER_HUB_PW" | docker login -u "$DOCKER_HUB_USER" --password-stdin

  script:
    # 1) build once (add any --build-arg you need)
    - docker build --build-arg NAME="Cloud Run" -t "$IMAGE_NAME:$IMAGE_TAG" .

    # 2) tag and push Docker
    - docker tag $IMAGE_NAME:$IMAGE_TAG $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG
    - docker push $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG

update_helm_chart:
  stage: update_helm_chart
  image: ubuntu:24.04
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client git -y )'
    - mkdir -p /root/.ssh
    - echo "$SSH_PRIVATE_KEY" > /root/.ssh/id_ed25519
    - chmod 600 /root/.ssh/id_ed25519
    - ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    # run ssh-agent
    - eval $(ssh-agent -s)
    # add ssh key stored in SSH_PRIVATE_KEY variable to the agent store
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    # Git
    - git config --global user.email $GITLAB_USER_EMAIL
    - git config --global user.name $GITLAB_USER_NAME
    - git clone $INFRA_REPO_SSH
    - cd music-release-notifier-k8s-cluster
    - ls -latr
  script:
    # Update Image TAG
    - sed -i "s/music-release-notifier-core:.*/${IMAGE_NAME}:${IMAGE_TAG}/g" mrn/core/values.yaml
    - git add mrn/core/values.yaml
    - git commit -am "Update Image"
    - git push