variables:
  # Docker‑in‑Docker config
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

  # Builds
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  # Container naming
  SERVICE_NAME: "music-release-notifier"
  IMAGE_NAME: "music-release-notifier-core"
  IMAGE_TAG: "v$CI_PIPELINE_ID"

stages:
  - build
  - test
  - publish
  - update_helm_chart

services:
  - name: docker:24.0.5-dind
    alias: docker

# 1) Build
build:
  stage: build
  image: gradle:jdk21
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
  script:
    - ./gradlew --build-cache assemble
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle

# 2) Unit tests
test:
  stage: test
  image: gradle:jdk21
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
  script:
    - ./gradlew check
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/**/TEST-*.xml
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - build
      - .gradle

# 3) Build & publish Docker
build_and_publish:
  stage: publish
  image: docker:24.0.5            # includes docker CLI
  before_script:
    - echo "$DOCKER_HUB_PW" | docker login -u "$DOCKER_HUB_USER" --password-stdin
  script:
    - docker build --build-arg NAME="Cloud Run" -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker tag "$IMAGE_NAME:$IMAGE_TAG" "$DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG"

# 4) Update Helm chart in infra repo
update_helm_chart:
  stage: update_helm_chart
  image: ubuntu:24.04
  before_script:
    - apt-get update -y && apt-get install -y openssh-client git
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - git config --global user.email "$GITLAB_USER_EMAIL"
    - git config --global user.name "$GITLAB_USER_NAME"
    - git clone "$INFRA_REPO_SSH"
    - cd music-release-notifier-k8s-cluster
  script:
    - sed -i "s/music-release-notifier-core:.*/${IMAGE_NAME}:${IMAGE_TAG}/g" mrn/core/values.yaml
    - git add mrn/core/values.yaml
    - git commit -am "Update Image"
    - git push
