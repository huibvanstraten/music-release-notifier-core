apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: default
spec:
  type: ClusterIp
  selector:
    app: core
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80


---


apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: keycloak
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80