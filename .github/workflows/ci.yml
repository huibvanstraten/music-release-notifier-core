name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/**'


env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  SERVICE_NAME: music-release-notifier
  IMAGE_TAG: v1954478252

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    container:
      image: gradle:jdk21
      options: --privileged  # enables Docker if needed for caching
      env:
        GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle and build
        uses: actions/cache@v4
        with:
          path: |
            .gradle
            build
          key: ${{ github.ref_name }}-gradle

      - name: Assemble project
        run: ./gradlew --build-cache assemble

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build]

    container:
      image: gradle:jdk21
      env:
        GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            .gradle
            build
          key: ${{ github.ref_name }}-gradle

      - name: Run tests
        run: ./gradlew check

      - name: Upload JUnit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: build/test-results/test/**/TEST-*.xml

  publish:
    name: Build & Publish Docker
    runs-on: ubuntu-latest
    needs: [ test ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PW }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            NAME=Cloud Run
