spring:
  application:
    name: outbox

kafka:
  enabled: true
  topic: ${KAFKA_TOPIC:music_monitor}
  delivery-timeout: 30000

outbox:
  publisher:
    cloudevent-source: "com.hvs.outbox"
    polling-rate: PT10S
  database: postgres

rabbitmq:
  exchange: ${RABBITMQ_EXCHANGE:music_monitor}
  queue: ${RABBITMQ_QUEUE:release}
  routing-key: ${RABBITMQ_ROUTING_KEY:release_routing_key}
  delivery-timeout: 1
  enabled: false